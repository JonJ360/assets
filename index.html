<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asset Register</title>
<style>
:root{
  --bg:#E9ECF1; --tile:#FFFFFF; --ink:#222A33; --muted:#6E7885; --line:#D5DBE3; --line2:#C3CBD6;
  --silver1:#FDFDFE; --silver2:#E6EAF0; --silver3:#D9DFE7;
  --blue:#2E6FD9; --blue2:#1F5AB8; --blue-lite:#E8F0FD; --blue-line:#B9D0F2;
  --green:#2F8F63; --red:#C0453C; --amber:#B5821F;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:12px;
  --lift:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(28,40,58,.10), 0 4px 10px rgba(28,40,58,.05);
  --press:0 1px 2px rgba(28,40,58,.14) inset;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}

/* ---- header ---- */
header{background:linear-gradient(180deg,#F6F8FB,#DFE4EC);border-bottom:1px solid var(--line2);
  padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 2px 8px rgba(28,40,58,.06)}
.brand{font-weight:750;letter-spacing:.06em;font-size:14px;color:#2C3742}
.brand b{color:var(--blue)}
.ver{font-family:var(--mono);font-size:11px;color:var(--muted)}
.spacer{flex:1}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;
  background:linear-gradient(180deg,var(--silver1),var(--silver2));border:1px solid var(--line2);box-shadow:var(--lift)}
.chip.live{background:linear-gradient(180deg,#EAF4EE,#CFE7DA);border-color:#A9CFBB;color:#1F6644}
.chip.local{background:linear-gradient(180deg,#FFF6E2,#F6E5BE);border-color:#E2C889;color:#7A5610}

/* ---- chiclet tab tray ---- */
.synct{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.syncbtn{width:30px;height:30px;border-radius:999px;border:1px solid var(--line2);cursor:pointer;font-size:15px;line-height:1;
  background:linear-gradient(180deg,var(--silver1),var(--silver2));box-shadow:var(--lift);color:#3D4854;display:inline-flex;align-items:center;justify-content:center}
.syncbtn:hover{background:linear-gradient(180deg,#fff,#EDF1F6)}
.syncbtn:active{box-shadow:var(--press);transform:translateY(1px)}
.syncbtn.spin{animation:spin .8s linear infinite;pointer-events:none;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.syncbtn.spin{animation:none}}
nav.tray{position:sticky;top:53px;z-index:39;background:var(--bg);padding:10px 16px 6px}
nav.tray .inner{display:inline-flex;gap:6px;padding:5px;border-radius:16px;background:linear-gradient(180deg,#DDE2EA,#EDF0F5);
  box-shadow:var(--press);border:1px solid var(--line2);max-width:100%;overflow:auto}
nav.tray button{border:1px solid var(--line2);border-radius:10px;padding:7px 16px;cursor:pointer;font-weight:600;white-space:nowrap;
  background:linear-gradient(180deg,var(--silver1),var(--silver2));box-shadow:var(--lift);color:#404A55}
nav.tray button:hover{background:linear-gradient(180deg,#fff,#EEF1F6)}
nav.tray button:active{box-shadow:var(--press);transform:translateY(1px)}
nav.tray button.on{background:linear-gradient(180deg,#5C90E4,var(--blue));border-color:var(--blue2);color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 2px 6px rgba(46,111,217,.35)}

main{padding:6px 16px 40px;max-width:1400px;margin:0 auto}

/* ---- tiles ---- */
.tile{background:var(--tile);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift);margin-bottom:14px;overflow:hidden}
.tile>.th{padding:11px 15px;background:linear-gradient(180deg,#FBFCFD,#EFF2F6);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tile>.th h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.tile>.tb{padding:14px}
.tile>.tb.flush{padding:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin:10px 0 14px}
.kpi{background:linear-gradient(180deg,#FFFFFF,#F1F4F8);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--lift)}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .val{font-family:var(--mono);font-size:23px;font-weight:600;margin-top:5px;letter-spacing:-.03em}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.hi{background:linear-gradient(180deg,#F4F8FF,var(--blue-lite));border-color:var(--blue-line)}
.kpi.hi .val{color:var(--blue2)}

.banner{background:linear-gradient(180deg,#FFFBF0,#FBEFD6);border:1px solid #E7CF9C;border-radius:var(--r);
  padding:11px 14px;margin-bottom:14px;font-size:13px;box-shadow:var(--lift)}
.banner code{font-family:var(--mono);font-size:12px;background:#00000010;padding:1px 5px;border-radius:4px}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;
  padding:9px 11px;background:linear-gradient(180deg,#F8FAFC,#EDF0F5);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th:hover:not(.nosort){color:var(--blue2)}
td{padding:9px 11px;border-bottom:1px solid #EFF2F5;vertical-align:top}
tbody tr:hover{background:var(--blue-lite)}
tbody tr.clickable{cursor:pointer}
tfoot td{background:linear-gradient(180deg,#F8FAFC,#EDF0F5);font-weight:650;border-bottom:0}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px}
.empty{padding:34px 14px;text-align:center;color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)}

/* ---- status chiclets ---- */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line2);background:linear-gradient(180deg,var(--silver1),var(--silver2));box-shadow:0 1px 0 rgba(255,255,255,.8) inset}
.s-Active{background:linear-gradient(180deg,#EAF4EE,#D2E7DC);border-color:#A9CFBB;color:#206043}
.s-Idle{background:linear-gradient(180deg,#F7F9FB,#E6EAF0);border-color:var(--line2);color:#4E5761}
.s-Repair{background:linear-gradient(180deg,#FFF7E7,#F4E6C6);border-color:#E0C68C;color:#7B5711}
.s-Sold{background:linear-gradient(180deg,#EFF4FE,#DAE6FA);border-color:var(--blue-line);color:#23539E}
.s-Disposed{background:linear-gradient(180deg,#FCEEEC,#F2D9D6);border-color:#E0B6B1;color:#8A342C}

/* ---- controls ---- */
.btn{border:1px solid var(--blue2);border-radius:10px;padding:7px 15px;font-weight:650;cursor:pointer;
  background:linear-gradient(180deg,#5C90E4,var(--blue));color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 1px 3px rgba(46,111,217,.3)}
.btn:hover{background:linear-gradient(180deg,#6699E8,#3376DE)}
.btn:active{box-shadow:var(--press);transform:translateY(1px)}
.btn.ghost{background:linear-gradient(180deg,var(--silver1),var(--silver2));border-color:var(--line2);color:#3D4854;box-shadow:var(--lift)}
.btn.ghost:hover{background:linear-gradient(180deg,#fff,#EDF1F6)}
.btn.danger{background:linear-gradient(180deg,#D06158,#B93F36);border-color:#9E362E}
.btn.sm{padding:4px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line2);
  border-radius:9px;background:linear-gradient(180deg,#FBFCFD,#fff);box-shadow:0 1px 1px rgba(28,40,58,.05) inset}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,111,217,.16)}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=text]{width:220px}
.filters select{width:auto;min-width:118px}
fieldset.fs{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 3px;margin:0 0 14px;
  background:linear-gradient(180deg,#FCFDFE,#F6F8FB)}
fieldset.fs>legend{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:0 7px}
/* asset cards (narrow screens) */
.acards{display:none;padding:10px;gap:9px;grid-template-columns:1fr}
.acard{background:linear-gradient(180deg,#FFFFFF,#F4F6FA);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;box-shadow:var(--lift);cursor:pointer}
.acard:active{box-shadow:var(--press);transform:translateY(1px)}
.ac-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.ac-unit{font-family:var(--mono);font-size:15px;font-weight:750;letter-spacing:.03em;color:#1B4A94;
  background:linear-gradient(180deg,#F3F8FF,#DEEAFB);border:1px solid var(--blue-line);border-radius:8px;padding:2px 9px}
.ac-unit.none{color:var(--muted);background:linear-gradient(180deg,#F8F9FB,#EBEEF2);border-color:var(--line2);font-weight:600;font-size:12px}
.ac-name{font-weight:700;font-size:15px;line-height:1.25}
.ac-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.ac-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ac-tags span{font-size:11.5px;font-weight:600;color:#4A5561;background:linear-gradient(180deg,#FBFCFD,#E9EDF2);
  border:1px solid var(--line2);border-radius:999px;padding:2px 9px}
.btn.warn{background:linear-gradient(180deg,#E0A63F,#C9861F);border-color:#A96F13}
.btn.warn:hover{background:linear-gradient(180deg,#E6B052,#D4901F)}
.pill.prog{background:linear-gradient(180deg,#FFF6DC,#F6E7BC);border-color:#E0C05F;color:#7B5B0D;margin-left:6px}
.ipbox{display:inline-flex;align-items:center;justify-content:center;padding:4px;cursor:pointer}
.ipline{display:flex;align-items:flex-start;gap:8px;margin:0 0 12px;padding:9px 11px;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#FFF9EA,#FBEFD6);border:1px solid #E7CF9C;font-size:12.5px;line-height:1.4}
.ipline input{width:18px;height:18px;accent-color:#C9861F;flex:0 0 auto;margin-top:1px;cursor:pointer}
.ro-dim{opacity:.65}
.ipbox input{width:19px;height:19px;accent-color:#C9861F;cursor:pointer}
.acard{position:relative}
.acard.gone{background:linear-gradient(180deg,#FBFAFD,#EEECF3);border-color:#D5CFE2}
.acard.gone .ac-name{color:#5A5566}
.acard.gone .ac-unit{color:#4C3572;background:linear-gradient(180deg,#F4F1FA,#E3DBF2);border-color:#D0C4E6}
.ac-ribbon{position:absolute;top:10px;right:0;font-size:9.5px;font-weight:800;letter-spacing:.14em;color:#fff;
  background:linear-gradient(180deg,#7B62A8,#5D4589);padding:3px 10px 3px 12px;border-radius:8px 0 0 8px;
  box-shadow:0 1px 3px rgba(46,32,74,.3)}
.acard.gone .ac-top .pill{visibility:hidden}
fieldset.fs.flash{animation:flashfs 1.4s ease}
@keyframes flashfs{0%,100%{background:linear-gradient(180deg,#FCFDFE,#F6F8FB);border-color:var(--line)}
  25%{background:linear-gradient(180deg,#FFF8E9,#FBEFD6);border-color:#E7CF9C}}
@media(prefers-reduced-motion:reduce){fieldset.fs.flash{animation:none;border-color:#E7CF9C}}

.ac-specs{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.ac-specs .sp{min-width:0}
.ac-specs .sp.wide{grid-column:1/-1}
.ac-specs .spl{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.ac-specs .spv{display:block;font-size:12.5px;line-height:1.35;word-break:break-word}
.ac-specs .spv .mono{font-size:12px}
.ac-specs em{font-style:normal;font-weight:700;font-size:11px}
.ac-specs .warn{color:var(--amber)}
.ac-foot{display:flex;align-items:baseline;gap:16px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.ac-money{font-size:14px;font-weight:650;display:flex;flex-direction:column}
.ac-lbl{font-family:var(--sans);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.ac-title{font-size:11.5px;color:var(--muted);text-align:right}
.ac-total{display:flex;justify-content:space-between;padding:8px 3px 2px;font-weight:650;font-size:13px;color:#3D4854}
@media(max-width:760px){
  .acards{display:grid}
  table.atable{display:none}
}

/* appendix */
.apx-group{margin-bottom:20px}
.apx-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 0 6px;border-bottom:2px solid var(--line2);margin-bottom:2px}
.apx-head h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.apx-head span{font-size:11.5px;color:var(--muted)}
table.apx{font-size:12px}
table.apx th{padding:6px 7px;font-size:9.5px;background:none;border-bottom:1px solid var(--line)}
table.apx td{padding:5px 7px;border-bottom:1px solid #F1F3F6}
table.apx td.b{font-weight:650}
table.apx td.sm{font-size:11px;color:#55606C}
.apx-note{font-size:10.5px;color:var(--muted)}
#apxBody{overflow-x:auto}
@media print{
  header,nav.tray,.banner,.btn,.tile>.th .hint{display:none!important}
  body{background:#fff;font-size:10px}
  main{padding:0;max-width:none}
  .tile{border:0;box-shadow:none;margin:0}
  .tile>.tb{padding:0}
  .apx-group{page-break-inside:auto;margin-bottom:14px}
  table.apx{font-size:9px}
  table.apx tr{page-break-inside:avoid}
  .apx-head h3{font-size:11px}
}

.catfilter{flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;padding:2px 0 4px}
.cat.sm{font-size:12.5px;padding:7px 6px;border-radius:9px;text-align:center;width:100%}
.catgroup{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px}
.catlbl{flex:0 0 74px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding-top:7px;text-align:right}
.cats{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.cat{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:9px;cursor:pointer;color:#414B57;
  background:linear-gradient(180deg,var(--silver1),var(--silver2));border:1px solid var(--line2);box-shadow:var(--lift)}
.cat:hover{background:linear-gradient(180deg,#fff,#EDF1F6);border-color:#AEBCCB}
.cat:active{box-shadow:var(--press);transform:translateY(1px)}
.cat.on{background:linear-gradient(180deg,#5C90E4,var(--blue));border-color:var(--blue2);color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 2px 6px rgba(46,111,217,.35)}
@media(max-width:520px){
  .catgroup{display:block}
  .catlbl{text-align:left;padding:0 0 3px}
}
.hint{font-size:12px;color:var(--muted)}
.f>.flbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:4px}
.f{margin-bottom:11px}
.unitrow{display:flex;gap:0;align-items:stretch;flex-wrap:wrap}
.unitrow .btn{margin-left:8px;align-self:center}
.unitplate{font-size:19px;font-weight:750;letter-spacing:.03em;padding:6px 14px;border-radius:10px;
  background:linear-gradient(180deg,#F3F8FF,#D9E7FA);border:1px solid var(--blue-line);color:#1B4A94;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(28,40,58,.08)}
.prefixchip{font-family:var(--mono);font-weight:750;font-size:16px;padding:7px 0;width:44px;text-align:center;
  border-radius:9px 0 0 9px;background:linear-gradient(180deg,#EEF1F6,#DBE1E9);border:1px solid var(--line2);border-right:0;color:#414B57}
#uNum{border-radius:0 9px 9px 0;max-width:112px;font-family:var(--mono);font-size:16px;font-weight:650}
.openchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.openchips .oc{font-family:var(--mono);font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;cursor:pointer;
  background:linear-gradient(180deg,#FDFDFE,#E6EAF0);border:1px solid var(--line2);color:#414B57;box-shadow:var(--lift)}
.openchips .oc:hover{background:linear-gradient(180deg,#F4F8FF,#DCE8FA);border-color:var(--blue-line);color:#1B4A94}
.openchips .oc.on{background:linear-gradient(180deg,#5C90E4,var(--blue));border-color:var(--blue2);color:#fff}
.openchips .oc:active{box-shadow:var(--press);transform:translateY(1px)}

/* ---- slide-over ---- */
.scrim{position:fixed;inset:0;background:rgba(26,36,48,.42);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:51;
  transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(20,30,44,.18)}
.sheet.on{transform:none}
.sheet .sh{padding:12px 16px;background:linear-gradient(180deg,#F6F8FB,#E4E9F0);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.sheet .sh h2{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .sh .navpos{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.sheet .sh #navPrev,.sheet .sh #navNext{padding:3px 11px;font-size:15px;line-height:1.1}
.sheet .sb{padding:14px 16px;overflow:auto;flex:1}
.sheet .sf{padding:11px 16px;background:linear-gradient(180deg,#F6F8FB,#E4E9F0);border-top:1px solid var(--line2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.x{background:transparent;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 6px;border-radius:8px}
.x:hover{background:#00000010}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2B3541;color:#fff;padding:10px 18px;
  border-radius:999px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px rgba(20,30,44,.3)}
#toast.on{opacity:1}
#toast.err{background:var(--red)}

@media(max-width:760px){
  main{padding:6px 10px 34px}
  nav.tray{padding:8px 10px 4px}
  .grid2,.grid3{grid-template-columns:1fr}
  table.responsive thead{display:none}
  table.responsive tr{display:block;border-bottom:1px solid var(--line);padding:8px 4px}
  table.responsive tbody tr:hover{background:transparent}
  table.responsive td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 8px}
  table.responsive td:before{content:attr(data-l);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
  table.responsive tfoot td{background:transparent}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <span class="brand">ASSET <b>REGISTER</b></span>
  <span class="ver" id="verTag">v1.34</span>
  <span class="spacer"></span>
  <span class="synct" id="syncT"></span>
  <button class="syncbtn" id="syncBtn" title="Sync now">&#10227;</button>
  <button class="chip" id="whoami" title="Sign out" style="cursor:pointer;border:1px solid var(--line2);display:none"></button>
  <span class="chip" id="conn">…</span>
</header>

<nav class="tray"><div class="inner" id="tabs">
  <button data-v="dash" class="on">Dashboard</button>
  <button data-v="assets">Assets</button>
  <button data-v="list">Appendix</button>
  <button data-v="hist">History</button>
  <button data-v="data">Import / Export</button>
  <a href="irp.html" style="text-decoration:none"><button type="button" title="Margi's compliance portal">IRP / IFTA &#8599;</button></a>
</div></nav>

<main id="view"></main>

<div class="scrim" id="scrim"></div>

/* ---------- unit # helpers ---------- */
// Accepts "F-107", "F107", "SMI 107", "107". Returns {pre, n} or null.
function parseUnit(u){
  const s=String(u||"").trim();
  if(!s) return null;
  const m=s.match(/^(.*?)[\s\-_]*(\d+)\s*$/);
  if(!m) return {pre:s.toUpperCase(),n:null};
  return {pre:m[1].toUpperCase().replace(/[\s\-_]+$/,""), n:parseInt(m[2],10)};
}
function prefixFor(branch){ return BAKED_CONFIG.UNIT_PREFIX[branch] || ""; }
function fmtUnit(pre,n){
  const pad=BAKED_CONFIG.UNIT_PAD||0;
  const num=pad? String(n).padStart(pad,"0") : String(n);
  return pre ? pre+BAKED_CONFIG.UNIT_SEP+num : num;
}
// Step the unit number up or down within a branch's series, skipping numbers
// already in use. dir = +1 (Next) or -1 (Prev). Series floor is 101.
const UNIT_FLOOR = 101;
function takenNums(pre,exceptId){
  const set=new Set();
  state.assets.forEach(a=>{
    if(a.id===exceptId) return;
    const p=parseUnit(a.unit_no);
    if(p && p.n!=null && p.pre===pre.toUpperCase()) set.add(p.n);
  });
  return set;
}
function stepUnit(branch,current,dir,exceptId){
  const pre=prefixFor(branch);
  if(!pre) return null;
  const taken=takenNums(pre,exceptId);
  const cur=parseUnit(current);
  let n;
  if(cur && cur.n!=null && (!cur.pre || cur.pre===pre.toUpperCase())){
    n=cur.n+dir;                      // step from what's in the field
  } else if(dir>0){
    n=(taken.size? Math.max(...taken) : UNIT_FLOOR-1)+1;   // highest + 1
  } else {
    n=UNIT_FLOOR;                     // lowest open in the series
    while(taken.has(n)) n++;
    return fmtUnit(pre,n);
  }
  while(taken.has(n)) n+=dir;
  if(n<UNIT_FLOOR) return null;
  return fmtUnit(pre,n);
}
function nextUnit(branch,exceptId){ return stepUnit(branch,"",1,exceptId)||""; }
function unitTaken(u,exceptId){
  const k=String(u||"").trim().toUpperCase();
  if(!k) return null;
  return state.assets.find(a=>a.id!==exceptId && String(a.unit_no||"").trim().toUpperCase()===k)||null;
}
// Sort: assigned units first, grouped by prefix, numeric within prefix. Blanks last.
function unitSortKey(u){
  const p=parseUnit(u);
  if(!p) return "\uffff";
  return p.pre+"|"+(p.n==null? "\uffff" : String(p.n).padStart(8,"0"));
}

const EDITORS = ["jonj@360-llc.com","margi@360-llc.com"];
const canEdit=()=> !LIVE || AUTH.isEditor();
const AUTH_KEY = "assets-auth-v1";

  email(){ return this.s?this.s.email:null; },
  isEditor(){ return !!this.s && EDITORS.includes(this.s.email.toLowerCase()); },
  async signIn(email,pin){
    const r=await fetch(BAKED_CONFIG.SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",headers:{apikey:BAKED_CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email,password:pin})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error_description||j.msg||"Sign-in failed");
    this.save({email:(j.user&&j.user.email||email).toLowerCase(),access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+ (j.expires_in-60)*1000});
  },
  async refresh(){
    if(!this.s) return false;
    const r=await fetch(BAKED_CONFIG.SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
      method:"POST",headers:{apikey:BAKED_CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:this.s.refresh_token})});
    if(!r.ok){ this.save(null); return false; }
    const j=await r.json();
    this.save({email:(j.user&&j.user.email||this.s.email).toLowerCase(),access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000});
    return true;
  },
  async token(){
    if(!this.s) return null;
    if(Date.now()>this.s.exp) await this.refresh();
    return this.s?this.s.access_token:null;
  },
  signOut(){ this.save(null); }
};

/* ---------- data layer ---------- */
async function sb(path, opt={}){
  const tok = await AUTH.token();
  const r = await fetch(BAKED_CONFIG.SUPABASE_URL+"/rest/v1/"+path, {
    method: opt.method||"GET",
    headers:{
      apikey: BAKED_CONFIG.SUPABASE_ANON_KEY,
      Authorization:"Bearer "+(tok||BAKED_CONFIG.SUPABASE_ANON_KEY),
      "Content-Type":"application/json",
      Prefer: opt.prefer||"return=representation"
    },
    body: opt.body? JSON.stringify(opt.body): undefined
  });
  if(r.status===401 && AUTH.s){
    const ok=await AUTH.refresh();
    if(ok) return sb(path,opt);
    showLogin(); throw new Error("Session expired — sign in again");
  }
  if(!r.ok) throw new Error((await r.text()).slice(0,300));
  return r.status===204 ? null : r.json();
}
const DB = {
  async load(){
    if(LIVE) state.assets = await sb("assets?select=*&order=unit_no.asc");
    else if(!state.assets.length) seed();
  },
  async save(a){
    a.updated_at=new Date().toISOString();
    if(LIVE){
      if(a.id){ const [x]=await sb("assets?id=eq."+a.id,{method:"PATCH",body:strip(a)}); return x; }
      const [x]=await sb("assets",{method:"POST",body:strip(a)}); return x;
    }
    if(a.id){ const i=state.assets.findIndex(x=>x.id===a.id); state.assets[i]=a; return a; }
    a.id=uid(); state.assets.push(a); return a;
  },
  async del(id){
    if(LIVE) await sb("assets?id=eq."+id,{method:"DELETE",prefer:"return=minimal"});
    state.assets=state.assets.filter(a=>a.id!==id);
  },
  async bulk(rows){
    if(LIVE){ const out=await sb("assets",{method:"POST",body:rows}); state.assets=state.assets.concat(out); return out.length; }
    rows.forEach(r=>{ r.id=uid(); state.assets.push(r); }); return rows.length;
  }
};
function strip(o){ const c=Object.assign({},o); delete c.id; delete c.created_at; return c; }

    if(f.status==="__held"){ if(!HELD.includes(a.status)) return false; }
    else if(f.status && a.status!==f.status) return false;
    if(f.nounit && String(a.unit_no||"").trim()!=="") return false;
    if(q && ![a.unit_no,a.name,a.make,a.model,a.vin,a.serial,a.plate,a.assigned_to,a.notes].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
  const k=state.sort.k,d=state.sort.dir;
  r.sort((a,b)=>{
    if(k==="unit_no") return unitSortKey(a.unit_no).localeCompare(unitSortKey(b.unit_no))*d;
    if(["purchase_price","sale_price","year","loan_payoff"].includes(k)) return ((Number(a[k])||0)-(Number(b[k])||0))*d;
    return String(a[k]||"").localeCompare(String(b[k]||""))*d;
  });
  return r;
}

/* ---------- attention flags (computed, never stored) ---------- */
function attentionFlags(a){
  const out=[];
  if(!HELD.includes(a.status)) return out;
  if(!a.insured) out.push("Not marked insured");
  const d=daysUntil(a.reg_expires);
  if(a.reg_expires && d!=null){
    if(d<0) out.push("Registration expired "+Math.abs(d)+"d ago");
    else if(d<=60) out.push("Registration renews in "+d+"d");
  }
  return out;
}

const fmtV=v=>{
  if(v===null||v===undefined||v==="") return "(blank)";
  if(v===true) return "yes"; if(v===false) return "no";
  const t=String(v); return t.length>60? t.slice(0,60)+"…" : t;
};
function histLines(h){
  if(h.op==="INSERT") return ['<em>Record created</em>'];
  if(h.op==="DELETE") return ['<em style="color:var(--red)">Record deleted</em>'];
  return Object.entries(h.changes||{}).map(([k,v])=>
    `<strong>${esc(FIELD_LABELS[k]||k)}</strong>: ${esc(fmtV(v.from))} → ${esc(fmtV(v.to))}`);
}
async function fetchHist(q){
  if(!LIVE) return null;
  try{ return await sb("asset_history?select=*&"+q); }catch(e){ return {err:e.message}; }
}
async function vHist(){
  $("#view").innerHTML = banner()+`<div class="tile"><div class="th"><h2>Change history — newest first</h2>
    <span class="spacer"></span><span class="hint" id="histN"></span></div>
    <div class="tb flush" id="histBody"><div class="empty">Loading…</div></div></div>`;
  const rows=await fetchHist("order=changed_at.desc&limit=150");
  const el=$("#histBody"); if(!el) return;
  if(!rows){ el.innerHTML='<div class="empty">History requires live mode.</div>'; return; }
  if(rows.err){ el.innerHTML=`<div class="empty">Could not load history: ${esc(rows.err)}.<br>Has history_setup.sql been run?</div>`; return; }
  if(!rows.length){ el.innerHTML='<div class="empty">No changes recorded yet.</div>'; return; }
  $("#histN").textContent=rows.length+" entries";

async function doImport(){
  const map=[...document.querySelectorAll("#mapArea select")].map(s=>s.value);
  if(!map.includes("name")){ toast("Map one column to Asset name",1); return; }
  const out=[];
  state.imp.rows.forEach(r=>{
    const o={status:"Active",insured:false};
    map.forEach((f,i)=>{
      if(!f) return;
      let v=(r[i]||"").trim();
      if(v==="") return;
      if(["purchase_price","sale_price","loan_payoff","year","gvw"].includes(f)) v=num(v.replace(/[$,]/g,""));
      if(["on_dep_schedule","in_progress","on_irp","on_ifta","on_2290"].includes(f)) v=/^(yes|y|x|true|1)$/i.test(v);
      if(["purchase_date","reg_expires"].includes(f)) v=normDate(v);
      if(f==="status" && !STATUSES.includes(v)) v="Active";
      if(f==="location" && !LOCATIONS.includes(v)) return;
      o[f]=v;
    });
    if(o.name) out.push(o);
  });
  if(!out.length){ toast("Nothing to import",1); return; }
  try{ const n=await DB.bulk(out); toast(n+" assets imported"); state.imp=null; state.view="assets"; render(); }
  catch(e){ toast(e.message,1); }
}
function normDate(v){
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let y=m[3]; if(y.length===2) y="20"+y; return `${y}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`; }
  return null;
}
function parseCSV(txt){
  const rows=[]; let row=[],cur="",q=false;
  txt=txt.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  const clean=rows.filter(r=>r.some(c=>String(c).trim()!==""));
  if(!clean.length) throw new Error("empty");
  return {head:clean[0].map(h=>h.trim()), rows:clean.slice(1)};
}
function toCSV(arr,cols){
  const q=v=>{ v=(v==null?"":String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return cols.join(",")+"\n"+arr.map(o=>cols.map(c=>q(o[c])).join(",")).join("\n")+"\n";
}
function dl(name,text){
  const b=new Blob([text],{type:"text/csv;charset=utf-8"});
  const u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500);
}

/* ---------- unit # field ---------- */
// Two modes. Locked: shows the number as a plate, no keystroke can change it.
// Edit: branch prefix is fixed, only the digits are typed, open numbers offered as chips.
function openNumbers(branch,exceptId,count){
  const pre=prefixFor(branch);
  if(!pre) return [];
  const taken=takenNums(pre,exceptId);
  const out=[];
  for(let n=UNIT_FLOOR; out.length<count && n<UNIT_FLOOR+500; n++) if(!taken.has(n)) out.push(n);
  const high=(taken.size? Math.max(...taken):UNIT_FLOOR-1)+1;
  if(!out.includes(high)) out.push(high);
  return out.slice(0,count+1);
}
function mountUnitField(id){
  const hid=$("#f_unit_no"), wrap=$("#unitWrap"), msg=$("#unitMsg"), bSel=$("#f_location");
  let mode = hid.value.trim() ? "locked" : "edit";
  let raw  = false;   // free-text fallback for legacy formats

  function branchPrefix(){ return prefixFor(bSel.value); }
  function say(t,bad){ msg.textContent=t||""; msg.className="hint"+(bad?" neg":""); }
  function validate(){
    const v=hid.value.trim();
    if(!v){ say("No unit number — normal for shop equipment."); return; }
    const dup=unitTaken(v,id);
    if(dup){ say("Already on "+(dup.name||"another asset"),1); return; }
    const p=parseUnit(v), want=branchPrefix();
    if(want && p && p.pre && p.pre!==want.toUpperCase()){ say(p.pre+" isn't the "+bSel.value+" prefix ("+want+")."); return; }
    say("");
  }
  function commit(v){ hid.value=v; validate(); }

  function draw(){
    if(mode==="locked"){
      wrap.innerHTML=`<div class="unitrow">
        <span class="unitplate mono">${esc(hid.value)}</span>
        <button type="button" class="btn ghost sm" id="uEdit">Change</button></div>`;
      $("#uEdit").onclick=()=>{ mode="edit"; draw(); };
      validate(); return;
    }
    const pre=branchPrefix();
    const cur=parseUnit(hid.value);
    const digits=(cur && cur.n!=null)? cur.n : "";
    if(raw){
      wrap.innerHTML=`<div class="unitrow">
        <input type="text" id="uRaw" value="${esc(hid.value)}" placeholder="SMI 107" style="flex:1;font-family:var(--mono)">
        <button type="button" class="btn ghost sm" id="uStd">Use ${esc(pre||"branch")} format</button></div>`;
      const r=$("#uRaw");
      r.oninput=()=>commit(r.value.trim());
      $("#uStd").onclick=()=>{ raw=false; draw(); };
      validate(); return;
    }
    const chips=openNumbers(bSel.value,id,4);
    wrap.innerHTML=`<div class="unitrow">
        <span class="prefixchip">${esc(pre|| "—")}</span>
        <input type="number" id="uNum" value="${digits}" placeholder="107" ${pre?"":"disabled"}>
        ${hid.value?`<button type="button" class="btn ghost sm" id="uLock">Done</button>`:""}
      </div>
      ${pre? `<div class="openchips"><span class="hint" style="align-self:center">Open:</span>
        ${chips.map(n=>`<button type="button" class="oc" data-n="${n}">${esc(fmtUnit(pre,n))}</button>`).join("")}</div>`
        : `<div class="hint" style="margin-top:6px">Pick a branch to number this asset.</div>`}
      <div style="margin-top:6px"><a href="#" id="uRawLink" class="hint">Enter a non-standard number</a></div>`;

    const nIn=$("#uNum");
    if(nIn){
      nIn.oninput=()=>{
        const d=nIn.value.trim();
        commit(d===""? "" : fmtUnit(branchPrefix(),parseInt(d,10)));
      };
    }
    wrap.querySelectorAll(".oc").forEach(b=>b.onclick=()=>{
      const n=parseInt(b.dataset.n,10);
      if(nIn) nIn.value=n;
      commit(fmtUnit(branchPrefix(),n));
      wrap.querySelectorAll(".oc").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
    });
    const lk=$("#uLock"); if(lk) lk.onclick=()=>{ if(hid.value.trim()){ mode="locked"; draw(); } };
    $("#uRawLink").onclick=e=>{ e.preventDefault(); raw=true; draw(); };
    validate();
  }

  bSel.addEventListener("change",()=>{
    if(mode==="edit" && !raw){
      const cur=parseUnit(hid.value);
      if(cur && cur.n!=null) commit(fmtUnit(branchPrefix(),cur.n));  // reprefix, keep digits
      draw();
    } else validate();
  });
  draw();
}

    </div>
    <div class="grid2">
      <label class="f"><span>Make</span><input type="text" id="f_make" value="${esc(a.make||"")}"></label>
      <label class="f"><span>Model</span><input type="text" id="f_model" value="${esc(a.model||"")}"></label>
    </div>
    <div class="grid3">
      <label class="f"><span>Year</span><input type="number" id="f_year" value="${a.year??""}"></label>
      <label class="f"><span>VIN</span><input type="text" id="f_vin" value="${esc(a.vin||"")}"></label>
      <label class="f"><span>Serial #</span><input type="text" id="f_serial" value="${esc(a.serial||"")}"></label>
    </div>
  </fieldset>

  <fieldset class="fs" id="priceFs"><legend>Price</legend>
    <div class="grid3">
      <label class="f"><span>Purchase date</span><input type="date" id="f_purchase_date" value="${a.purchase_date||""}"></label>
      <label class="f"><span>Purchase price</span><input type="number" step="0.01" id="f_purchase_price" value="${a.purchase_price??""}"></label>
      <label class="f"><span>Sell price</span><input type="number" step="0.01" id="f_sale_price" value="${a.sale_price??""}"></label>
    </div>
    ${g!=null?`<p class="hint" style="margin-top:-2px">Sell vs. purchase: <strong class="${g>=0?"pos":"neg"}">${signed(g)}</strong> — before depreciation. Book gain/loss comes from GP.</p>`:""}
    <label class="f"><span>Purchased from</span><input type="text" id="f_vendor" value="${esc(a.vendor||"")}"></label>
  </fieldset>

  <fieldset class="fs"><legend>Assignment</legend>
    <div class="grid2">
      <label class="f"><span>Owning entity</span><select id="f_entity">${opts(ents,a.entity,"—")}</select></label>
      <label class="f"><span>Branch</span><select id="f_location">${opts(LOCATIONS,a.location,"—")}</select></label>
    </div>
    <div class="grid3">
      <label class="f"><span>Assigned to</span><input type="text" id="f_assigned_to" value="${esc(a.assigned_to||"")}"></label>
      <label class="f"><span>Plate</span><input type="text" id="f_plate" value="${esc(a.plate||"")}"></label>
      <label class="f"><span>GVW (lb)</span><input type="number" id="f_gvw" value="${a.gvw??""}"></label>
    </div>
    <label class="f"><span>Registration expires</span><input type="date" id="f_reg_expires" value="${a.reg_expires||""}"></label>
    <label class="f"><span>Insurance</span><select id="f_insured"><option value="true"${a.insured?" selected":""}>Scheduled on policy</option><option value="false"${!a.insured?" selected":""}>Not scheduled</option></select></label>
  </fieldset>

  <fieldset class="fs"><legend>Financing</legend>
    <div class="grid3">
      <label class="f"><span>Funding</span><select id="f_funding">${opts(FUNDING,a.funding||"Cash")}</select></label>
      <label class="f"><span>Lender</span><input type="text" id="f_lender" value="${esc(a.lender||"")}"></label>
      <label class="f"><span>Loan payoff</span><input type="number" step="0.01" id="f_loan_payoff" value="${a.loan_payoff??""}"></label>
    </div>
  </fieldset>

  <fieldset class="fs"><legend>Title</legend>
    <div class="f"><span class="flbl">Where the title is</span>
      <input type="hidden" id="f_title_status" value="${esc(a.title_status||"")}">
      <div id="titleWrap"></div>
    </div>
    <div class="grid3">
      <label class="f"><span>Title state</span><input type="text" id="f_state" value="${esc(a.state||"")}" placeholder="ND"></label>
      <label class="f"><span>Title number</span><input type="text" id="f_title_number" value="${esc(a.title_number||"")}"></label>
      <label class="f"><span>Origin</span><select id="f_origin">${opts(["Physical Title","Old Sheet"],a.origin,"—")}</select></label>
    </div>
    <label class="f"><span>Held by / note</span><input type="text" id="f_title_note" value="${esc(a.title_note||"")}" placeholder="Bell Bank — released on payoff"></label>
  </fieldset>

  <fieldset class="fs"><legend>Depreciation schedule</legend>
    <div class="grid2">
      <label class="f"><span>On schedule</span><select id="f_on_dep_schedule"><option value="true"${a.on_dep_schedule?" selected":""}>Yes</option><option value="false"${!a.on_dep_schedule?" selected":""}>No</option></select></label>
      <label class="f"><span>Schedule line</span><input type="text" id="f_dep_location" value="${esc(a.dep_location||"")}" placeholder="Line 20"></label>
    </div>
  </fieldset>

  <fieldset class="fs"><legend>Compliance programs</legend>
    <input type="hidden" id="f_on_irp" value="${a.on_irp?"true":"false"}">
    <input type="hidden" id="f_on_ifta" value="${a.on_ifta?"true":"false"}">
    <input type="hidden" id="f_on_2290" value="${a.on_2290?"true":"false"}">
    <div class="cats" style="margin-bottom:10px">
      <button type="button" class="cat${a.on_irp?" on":""}" data-prog="on_irp">IRP</button>
      <button type="button" class="cat${a.on_ifta?" on":""}" data-prog="on_ifta">IFTA</button>
      <button type="button" class="cat${a.on_2290?" on":""}" data-prog="on_2290">2290</button>
    </div>
    <p class="hint" style="margin-top:-4px;margin-bottom:10px">Saved with the form. Plates, weights, and renewals live in the <a href="irp.html">IRP / IFTA portal</a>.</p>
  </fieldset>

  ${id&&LIVE?`<fieldset class="fs"><legend>History</legend><div id="histWrap" class="hint">Loading…</div></fieldset>`:""}

  <fieldset class="fs"><legend>Notes</legend>
    <label class="f"><span>Notes</span><textarea id="f_notes" rows="3">${esc(a.notes||"")}</textarea></label>
    <label class="f"><span>Document link</span><input type="text" id="f_doc_url" value="${esc(a.doc_url||"")}" placeholder="SharePoint / OneDrive URL"></label>
  </fieldset>`;

  const isSold = a.status==="Sold";
  $("#sheetFoot").innerHTML= !canEdit() ? `<span class="hint" style="align-self:center">View only — your account can't make changes.</span><button class="btn ghost" id="closeA2">Close</button>` : `<button class="btn" id="saveA">${id?"Save changes":"Create asset"}</button>
    ${id?`<button class="btn ${isSold?"ghost":"warn"}" id="soldA">${isSold?"Return to active":"Mark sold"}</button>`:""}
    <button class="btn ghost" id="cancelA">Cancel</button>
    <span class="spacer"></span>
    ${id&&canEdit()?`<button class="btn danger" id="delA">Delete</button>`:""}`;
  const sv=$("#saveA"); if(sv) sv.onclick=saveSheet;
  const cn=$("#cancelA"); if(cn) cn.onclick=()=>closeSheet();
  const c2=$("#closeA2"); if(c2) c2.onclick=()=>closeSheet(true);
  if(!canEdit()){
    $("#sheetBody").querySelectorAll("input,select,textarea,button.cat,[data-prog]").forEach(el=>{ el.disabled=true; el.classList&&el.classList.add("ro-dim"); });
    $("#sheetBody").querySelectorAll("[data-ip]").forEach(el=>el.disabled=true);
  }
  const soldBtn=$("#soldA");
  if(soldBtn) soldBtn.onclick=()=>{
    const st=$("#f_status"), sp=$("#f_sale_price"), fs=$("#priceFs");
    if(st.value==="Sold"){
      st.value="Active";
      toast("Back to Active — Save to confirm");
    } else {
      st.value="Sold";
      fs.scrollIntoView({block:"center",behavior:"smooth"});
      fs.classList.add("flash"); setTimeout(()=>fs.classList.remove("flash"),1400);
      sp.focus();
      toast("Enter the sell price, then Save");
    }
    soldBtn.textContent = st.value==="Sold" ? "Return to active" : "Mark sold";
    soldBtn.className = "btn "+(st.value==="Sold" ? "ghost" : "warn");
  };
  const stSel=$("#f_status");
  if(soldBtn && stSel) stSel.addEventListener("change",()=>{
    soldBtn.textContent = stSel.value==="Sold" ? "Return to active" : "Mark sold";
    soldBtn.className = "btn "+(stSel.value==="Sold" ? "ghost" : "warn");
  });

  mountUnitField(id);
  mountChiclets("f_category","catWrap",CATEGORIES,{strayFrom:"category"});
  mountChiclets("f_title_status","titleWrap",TITLE_STATUSES,{strayFrom:"title_status"});
  $("#sheetBody").querySelectorAll("[data-prog]").forEach(b=>b.onclick=()=>{
    const h=$("#f_"+b.dataset.prog);
    h.value = h.value==="true" ? "false" : "true";
    b.classList.toggle("on", h.value==="true");
  });

  const db_=$("#delA"); if(id&&db_) db_.onclick=async()=>{
    if(!confirm("Delete this asset? This cannot be undone.")) return;
    try{ await DB.del(id); closeSheet(true); toast("Asset deleted"); render(); }catch(e){ toast(e.message,1); }
  };
  if(id&&LIVE) (async()=>{
    const rows=await fetchHist("asset_id=eq."+id+"&order=changed_at.desc&limit=15");
    const w=$("#histWrap"); if(!w) return;
    if(!rows||rows.err){ w.textContent="History unavailable"+(rows&&rows.err?" — run history_setup.sql":""); return; }
    if(!rows.length){ w.textContent="No changes recorded since history began."; return; }
    w.innerHTML=rows.map(h=>`<div style="margin-bottom:8px"><span class="mono" style="font-size:11px">${esc(String(h.changed_at).slice(0,16).replace("T"," "))}</span><br>${histLines(h).join("<br>")}</div>`).join("");
  })();
  setupNav(id);
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
  $("#sheetBody").scrollTop=0;
}
async function saveSheet(){
  const a=readForm();
  if(!a.name){ toast("Asset name is required",1); return; }
  if(a.unit_no){
    const dup=unitTaken(a.unit_no,a.id);
    if(dup && !confirm("Unit "+a.unit_no+" is already on "+(dup.name||"another asset")+". Save anyway?")) return;
  }
  const isNew=!a.id;
  try{
    await DB.save(a);
    if(LIVE){ await DB.load(); state.lastSync=new Date(); }
    closeSheet(true); toast(isNew?"Asset created":"Saved"); render();
  }catch(e){ toast(e.message,1); }
}

/* ---------- login ---------- */
function showLogin(){
  $("#loginScrim").classList.add("on");
  $("#loginBox").style.display="block";
  $("#li_email").value=AUTH.email()||"";
  $("#li_err").textContent="";
  setTimeout(()=>$(AUTH.email()?"#li_pin":"#li_email").focus(),50);
}
function hideLogin(){ $("#loginScrim").classList.remove("on"); $("#loginBox").style.display="none"; }
async function doLogin(){
  const em=$("#li_email").value.trim().toLowerCase(), pin=$("#li_pin").value;
  if(!em||!pin){ $("#li_err").textContent="Email and PIN required"; return; }
  $("#li_go").disabled=true;
  try{
    await AUTH.signIn(em,pin);
    hideLogin();
    await syncNow();
    render();
  }catch(e){ $("#li_err").textContent=e.message; }
  finally{ $("#li_go").disabled=false; }
}
document.addEventListener("DOMContentLoaded",()=>{});
 
/* ---------- sync ---------- */
async function syncNow(){
  if(!LIVE || state.syncing) return;
  state.syncing=true; $("#syncBtn").classList.add("spin");
  try{
    await DB.load();
    state.lastSync=new Date(); state.syncError=false;
    render(); toast("Synced");
  }catch(e){
    state.syncError=true; render(); toast("Sync failed: "+e.message,1);
  }finally{
    state.syncing=false; $("#syncBtn").classList.remove("spin");
  }
}
$("#syncBtn").addEventListener("click",syncNow);
$("#conn").addEventListener("click",()=>{ if(state.syncError) syncNow(); });
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && LIVE && state.lastSync && (Date.now()-state.lastSync.getTime())>60000
     && !$("#sheet").classList.contains("on")) syncNow();
});
// Back/forward navigation restores a frozen page from the browser cache — always re-sync then.
window.addEventListener("pageshow",e=>{ if(e.persisted && LIVE) syncNow(); });

/* ---------- boot ---------- */
$("#li_go").addEventListener("click",doLogin);
$("#li_pin").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
$("#whoami").addEventListener("click",()=>{ if(confirm("Sign out?")){ AUTH.signOut(); location.reload(); } });
(async function(){
  AUTH.load();
  if(LIVE && !AUTH.s){ render(); showLogin(); return; }
  try{ await DB.load(); if(LIVE) state.lastSync=new Date(); }
  catch(e){ state.syncError=true; toast("Load failed: "+e.message,1); }
  render();
})();
</script>
</body>
</html>
